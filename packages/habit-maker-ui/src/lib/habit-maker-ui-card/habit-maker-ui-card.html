<article class="hm-card">
  <header class="hm-card__header">
    <div class="hm-card__icon" aria-hidden="true">
      @if (emoji(); as selectedEmoji) {
      <span class="hm-card__emoji">{{ selectedEmoji }}</span>
      } @else {
      <hm-icon class="hm-card__brand-icon" name="sprout" />
      }
    </div>
    <div class="hm-card__heading">
      <div class="hm-card__heading-content">
        <div class="hm-card__meta">
          <time class="hm-card__since" [attr.datetime]="dateTime()">
            <hm-icon class="hm-card__since-icon" name="clock" />
            {{ formattedSinceDate() }}
          </time>
          @if (showStreak()) {
          <span
            class="hm-card__streak"
            [title]="streakLabel()"
            [attr.aria-label]="streakLabel()"
          >
            <hm-icon class="hm-card__streak-icon" name="flame" />
            {{ streak() }}
          </span>
          }
        </div>
        <div class="hm-card__title">
          <ng-content select="[hmCardTitle]"></ng-content>
        </div>
      </div>
      @if (link(); as linkUrl) {
      <a
        class="hm-card__link"
        [routerLink]="linkUrl"
        [attr.aria-label]="linkLabel()"
      >
        <hm-icon class="hm-card__link-icon" name="arrow-right" />
      </a>
      }
    </div>
  </header>
  <div class="hm-card__content">
    <ng-content></ng-content>
  </div>
</article>
