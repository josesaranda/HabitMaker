<dialog
  #dialog
  class="hm-modal"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="label()"
  (cancel)="onCancel($event)"
  (click)="onDialogClick($event)"
>
  <section class="hm-modal__surface">
    <header
      class="hm-modal__header"
      [class.hm-modal__header--titled]="hasTitle()"
    >
      @if (hasTitle()) {
      <div class="hm-modal__title">
        <ng-content select="[hmModalTitle]" />
      </div>
      }
      <button
        class="hm-modal__close-button"
        type="button"
        [attr.aria-label]="closeLabel()"
        (click)="close()"
      >
        <habit-maker-ui-icon name="close" />
      </button>
    </header>
    <div
      class="hm-modal__content"
      [class.hm-modal__content--titled]="hasTitle()"
    >
      <ng-content select="[hmModalContent]" />
      <ng-content />
    </div>
  </section>
</dialog>
