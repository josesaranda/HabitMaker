<header class="habit-maker-ui-header">
  @if (backNavigation(); as backUrl) {
    <a
      class="habit-maker-ui-header__back"
      [routerLink]="backUrl"
      [attr.aria-label]="backLabel()"
      [title]="backTitle()"
    >
      <hm-icon class="size-5" name="arrow-left" />
    </a>
  }
  <h1 class="habit-maker-ui-header__title"><ng-content /></h1>
</header>
