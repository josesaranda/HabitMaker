<header class="habit-maker-header">
  @if (backNavigation(); as backUrl) {
    <a
      class="habit-maker-header__back"
      [routerLink]="backUrl"
      aria-label="Volver a la página anterior"
      title="Volver"
    >
      <hm-icon class="size-5" name="arrow-left" />
    </a>
  }
  <h1 class="habit-maker-header__title"><ng-content /></h1>
</header>
