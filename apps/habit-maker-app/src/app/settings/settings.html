<main class="min-h-full bg-background px-4 pb-8 sm:px-[4vw] lg:px-12">
  <habit-maker-ui-header
    backNavigation="/"
    [backLabel]="'navigation.back' | transloco"
    [backTitle]="'navigation.backTitle' | transloco"
    >{{ 'settings.title' | transloco }}</habit-maker-ui-header
  >
  <div class="mx-auto mt-4 w-full max-w-3xl space-y-6">
    <app-settings-user />
    @if (isAdmin()) {
    <app-settings-admin />
    }
  </div>
</main>
