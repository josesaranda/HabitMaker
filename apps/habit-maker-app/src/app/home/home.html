<main class="flex h-full flex-col bg-background px-4 py-5 sm:px-[4vw] lg:px-12">
  @if (isLoading()) {
  <p class="mt-6 self-center text-text-secondary" role="status">
    Cargando tus hábitos…
  </p>
  } @else if (hasHabits()) {
  <section
    class="mx-auto grid w-full max-w-6xl grid-cols-1 items-start gap-4 sm:grid-cols-2 xl:grid-cols-3"
    aria-labelledby="habits-title"
  >
    <h1
      id="habits-title"
      class="col-span-full mb-1 text-2xl font-semibold tracking-tight text-text-primary"
    >
      Tus hábitos
    </h1>
    @for (habit of habits(); track habit.id) {
    <a
      class="block rounded-2xl no-underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#e6b875] hover:shadow-[0_0.5rem_1rem_rgb(0_0_0_/_55%)] hover:transform hover:scale-[1.02] transition-all duration-300 ease-in-out"
      [routerLink]="['/habits', habit.id]"
      [attr.aria-label]="'Ver hábito ' + habit.name"
    >
      <app-habit-card
        [id]="habit.id"
        [name]="habit.name"
        [startedAt]="habit.createdAt"
      />
    </a>
    }
  </section>
  } @else {
  <section
    class="mx-auto my-auto w-full max-w-xl rounded-2xl border border-border bg-surface p-8 text-center sm:p-12 lg:p-16"
    aria-labelledby="home-title"
    data-testid="home-welcome"
  >
    <h1
      id="home-title"
      class="my-[0.8rem] text-[clamp(2rem,5vw,3rem)] font-semibold tracking-[-0.05em] text-text-primary"
    >
      ¡Bienvenido a casa!
    </h1>
    <p class="m-0 leading-relaxed text-text-secondary">
      Tu espacio para crear hábitos que te hacen bien empieza aquí.
    </p>
    @if (loadError()) {
    <p class="mt-6 text-error" role="alert">{{ loadError() }}</p>
    }
    <button
      #addHabitTrigger
      hmButton="primary"
      class="mt-6"
      data-testid="home-add-habit"
      type="button"
      (click)="newHabitModal.openFrom(addHabitTrigger)"
    >
      Añade tu primer hábito
    </button>
  </section>
  }
  <hm-modal #newHabitModal label="¿Qué hábito quieres crear?">
    <app-new-habit (habitCreated)="newHabitModal.close()" />
  </hm-modal>
</main>
