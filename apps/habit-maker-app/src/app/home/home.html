      Inicio

      class="home-navbar__logout"
      type="button"
      aria-label="Cerrar sesión"
      title="Cerrar sesión"
      (click)="logout()"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M10 17l5-5-5-5m5 5H3"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

  <section class="home-card" aria-labelledby="home-title">
    <h1 id="home-title">¡Bienvenido a casa!</h1>
    <p>Tu espacio para crear hábitos que te hacen bien empieza aquí.</p>
