<section class="auth-story" aria-labelledby="story-title">
  <a class="brand" routerLink="/login" aria-label="HabitMaker">
    <habit-maker-ui-brand />
  </a>

  <div class="auth-story-copy">
    <span class="eyebrow">
      <span class="eyebrow-dot"></span> {{ 'authStory.eyebrow' | transloco }}
    </span>
    <h1 id="story-title" [innerHTML]="'authStory.title' | transloco"></h1>
    <p>{{ 'authStory.intro' | transloco }}</p>
  </div>

  <app-habit-card
    id="example"
    [name]="'authStory.exampleHabit' | transloco"
    startedAt="2023-10-01"
    [dayToggleEnabled]="true"
    [previewCompletedDayOffsets]="previewCompletedDayOffsets()"
  />
  <span
    class="story-decoration story-decoration--one"
    aria-hidden="true"
  ></span>
  <span
    class="story-decoration story-decoration--two"
    aria-hidden="true"
  ></span>
  <p class="story-footer">{{ 'authStory.footer' | transloco }}</p>
</section>
