<section class="auth-story" aria-labelledby="story-title">
  <a class="brand" routerLink="/login" aria-label="HabitMaker">
    <hm-brand />
  </a>

  <div class="auth-story-copy">
    <span class="eyebrow">
      <span class="eyebrow-dot"></span> Pequeños pasos, grandes cambios
    </span>
    <h1 id="story-title">Lo que haces cada día <em>te transforma.</em></h1>
    <p>
      Crea hábitos que se sientan bien. Un día a la vez, a tu propio ritmo.
    </p>
  </div>

  <div class="habit-card" aria-label="Ejemplo de progreso semanal">
    <div class="habit-card-header">
      <div class="habit-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M12 20v-8m0 3c-4.4 0-6.5-2.3-6.5-5.8 3.8 0 6.5 1.7 6.5 5.8Zm0-2c0-3.8 2.2-6 6.5-6 0 3.6-2.1 6-6.5 6Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="habit-card-title">
        <strong>Un poco de lectura</strong>
        <span>Tu semana, en progreso</span>
      </div>
      <span class="streak">✦ 5 días</span>
    </div>
    <div class="week-days" aria-hidden="true">
      <div class="day completed"><span>L</span><b>✓</b></div>
      <div class="day completed"><span>M</span><b>✓</b></div>
      <div class="day completed"><span>X</span><b>✓</b></div>
      <div class="day completed"><span>J</span><b>✓</b></div>
      <div class="day completed"><span>V</span><b>✓</b></div>
      <div class="day today"><span>S</span><b>·</b></div>
      <div class="day"><span>D</span><b></b></div>
    </div>
    <div class="card-note">
      <span class="note-sparkle">✳</span> La constancia también puede ser
      amable.
    </div>
  </div>
  <span
    class="story-decoration story-decoration--one"
    aria-hidden="true"
  ></span>
  <span
    class="story-decoration story-decoration--two"
    aria-hidden="true"
  ></span>
  <p class="story-footer">Cultiva una vida que se parezca a ti.</p>
</section>
