<main class="auth-shell">
  <app-auth-story />

  <section class="auth-panel" aria-labelledby="login-title">
    <div class="auth-content">
      <h2 id="login-title">Inicia sesión</h2>
      <p class="auth-intro">Retoma tus hábitos justo donde los dejaste.</p>

      <form class="auth-form" (submit)="onSubmit($event)">
        <div class="form-field">
          <label for="email">Correo electrónico</label>
          <input
            hmInput
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="tu@correo.com"
            required
          />
        </div>

        <div class="form-field">
          <div class="field-heading">
            <label for="password">Contraseña</label>
          </div>
          <div class="password-field">
            <input
              hmInput
              id="password"
              name="password"
              [type]="passwordVisible() ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="Escribe tu contraseña"
              required
              minlength="8"
            />
            <button
              class="password-toggle"
              type="button"
              (click)="passwordVisible.update((visible) => !visible)"
              [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [attr.aria-pressed]="passwordVisible()"
            >
              @if (passwordVisible()) {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M3 3l18 18M10.6 10.7a2 2 0 0 0 2.7 2.7"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
                <path
                  d="M9.9 5.2A10.8 10.8 0 0 1 12 5c5.5 0 9 7 9 7a15 15 0 0 1-3 3.9M6.2 6.3C4.1 7.8 3 12 3 12s3.5 7 9 7c1 0 1.9-.2 2.7-.5"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              } @else {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M3 12s3.5-7 9-7 9 7 9 7-3.5 7-9 7-9-7-9-7Z"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linejoin="round"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="2.5"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
              </svg>
              }
            </button>
          </div>
        </div>

        <div class="flex flew-wrap gap-2 justify-between items-center">
          <label class="remember-option">
            <input hmCheckbox type="checkbox" name="remember" />
            <span>Recordar mi sesión</span>
          </label>
          <a class="text-xs" hmLink routerLink="/forgot-password"
            >¿Olvidaste la contraseña?</a
          >
        </div>

        <button hmButton="primary" class="auth-submit-button" type="submit">
          Iniciar sesión
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path
              d="M4 10h12m-5-5 5 5-5 5"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <p class="form-message" aria-live="polite">{{ message() }}</p>
      </form>

      <p class="auth-account-prompt">
        ¿Aún no tienes cuenta? <a hmLink routerLink="/signup">Empieza gratis</a>
      </p>
      <div class="auth-reassurance">
        <span aria-hidden="true">✳</span> Tus hábitos, solo tuyos. Siempre.
      </div>
    </div>
    <footer class="auth-footer">
      © 2025 HabitMaker <span>·</span> Un día a la vez
    </footer>
  </section>
</main>
