<main class="auth-shell">
  <app-auth-story />

  <section class="auth-panel" aria-labelledby="login-title">
    <div class="auth-content">
      <h2 id="login-title">Inicia sesión</h2>
      <p class="auth-intro">Retoma tus hábitos justo donde los dejaste.</p>

      <form class="auth-form" (submit)="onSubmit($event)">
        <div class="form-field">
          <label for="email">Correo electrónico</label>
          <input
            hmInput
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="tu@correo.com"
            required
          />
        </div>

        <div class="form-field">
          <div class="field-heading">
            <label for="password">Contraseña</label>
          </div>
          <div class="password-field">
            <input
              hmInput
              id="password"
              name="password"
              [type]="passwordVisible() ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="Escribe tu contraseña"
              required
              minlength="8"
            />
            <button
              class="password-toggle"
              type="button"
              (click)="passwordVisible.update((visible) => !visible)"
              [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [attr.aria-pressed]="passwordVisible()"
            >
              <hm-icon [name]="passwordVisible() ? 'eye-off' : 'eye'" />
            </button>
          </div>
        </div>

        <div class="flex flew-wrap gap-2 justify-between items-center">
          <label class="remember-option">
            <input hmCheckbox type="checkbox" name="remember" />
            <span>Recordar mi sesión</span>
          </label>
          <a class="text-xs" hmLink routerLink="/forgot-password"
            >¿Olvidaste la contraseña?</a
          >
        </div>

        <button hmButton="primary" class="auth-submit-button" type="submit">
          Iniciar sesión
          <hm-icon name="arrow-right" />
        </button>
        <p class="form-message" aria-live="polite">{{ message() }}</p>
      </form>

      <p class="auth-account-prompt">
        ¿Aún no tienes cuenta? <a hmLink routerLink="/signup">Empieza gratis</a>
      </p>
      <div class="auth-reassurance">
        <span aria-hidden="true">✳</span> Tus hábitos, solo tuyos. Siempre.
      </div>
    </div>
    <footer class="auth-footer">
      © 2025 HabitMaker <span>·</span> Un día a la vez
    </footer>
  </section>
</main>
