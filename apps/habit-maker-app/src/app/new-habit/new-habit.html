<div class="grid gap-6">
  <header class="grid justify-items-center text-center">
    <span
      class="mb-4 grid size-[3.25rem] place-items-center rounded-[1.1rem] border border-accent/55 bg-accent/20 text-primary"
      aria-hidden="true"
    >
      <habit-maker-ui-icon class="size-[1.6rem]" name="sparkle" />
    </span>
    <p
      class="mb-2 mt-0 text-[0.72rem] font-bold uppercase tracking-[0.12em] text-green-800"
    >
      {{ 'newHabit.eyebrow' | transloco }}
    </p>
    <h2
      class="m-0 text-[clamp(1.45rem,4vw,1.8rem)] leading-[1.2] tracking-[-0.045em] text-text-primary"
    >
      {{ 'newHabit.title' | transloco }}
    </h2>
    <p class="mt-[0.65rem] max-w-[25rem] leading-[1.55] text-text-secondary">
      {{ 'newHabit.intro' | transloco }}
    </p>
  </header>
  <form class="grid gap-4" [formGroup]="habitForm" (ngSubmit)="createHabit()">
    <hm-form-field>
      <label hmLabel for="new-habit-name">
        {{ 'newHabit.label' | transloco }}
      </label>
      <input
        [hmInput]="nameError() ? 'error' : 'default'"
        id="new-habit-name"
        name="habit"
        formControlName="name"
        type="text"
        maxlength="100"
        autofocus
        class="rounded-[0.85rem]"
        autocomplete="off"
        [placeholder]="'newHabit.placeholder' | transloco"
        [attr.aria-invalid]="nameError() ? 'true' : null"
        [attr.aria-describedby]="nameError() ? 'new-habit-name-error' : 'new-habit-name-hint'"
        (blur)="nameTouched.set(true)"
      />
      @if (nameError(); as nameErrorKey) {
      <p hmError id="new-habit-name-error">{{ nameErrorKey | transloco }}</p>
      } @else {
      <p hmHint id="new-habit-name-hint">{{ 'newHabit.hint' | transloco }}</p>
      }
    </hm-form-field>
    <hm-form-field>
      <label hmLabel id="new-habit-emoji-label">
        {{ 'emojiPicker.label' | transloco }}
      </label>
      <habit-maker-ui-emoji-picker
        role="group"
        aria-labelledby="new-habit-emoji-label"
        [noneOptionLabel]="'emojiPicker.none' | transloco"
        [selectedEmoji]="selectedEmoji()"
        (emojiSelected)="selectEmoji($event)"
      />
    </hm-form-field>
    @if (errorMessage()) {
    <p class="m-0 text-sm text-error" role="alert">
      {{ errorMessage() | transloco }}
    </p>
    }
    <button
      hmButton="primary"
      class="min-h-[3.25rem] w-full rounded-[0.85rem] font-semibold"
      type="submit"
      [disabled]="!canStartHabit()"
    >
      <span
        >{{ (isSubmitting() ? 'newHabit.saving' : 'newHabit.submit') | transloco
        }}</span
      >
      <habit-maker-ui-icon class="size-[1.15rem]" name="arrow-right" />
    </button>
  </form>
</div>
