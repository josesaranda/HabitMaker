<div class="grid gap-6">
  <header class="grid justify-items-center text-center">
    <span
      class="mb-4 grid size-[3.25rem] place-items-center rounded-[1.1rem] border border-accent/55 bg-accent/20 text-primary"
      aria-hidden="true"
    >
      <svg class="size-[1.6rem]" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 2.5c.8 5.1 2.4 6.7 9.5 7.5-7.1.8-8.7 2.4-9.5 9.5-.8-7.1-2.4-8.7-9.5-9.5 7.1-.8 8.7-2.4 9.5-7.5Z"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </svg>
    </span>
    <p
      class="mb-2 mt-0 text-[0.72rem] font-bold uppercase tracking-[0.12em] text-green-800"
    >
      Un hábito a la vez
    </p>
    <h2
      class="m-0 text-[clamp(1.45rem,4vw,1.8rem)] leading-[1.2] tracking-[-0.045em] text-text-primary"
    >
      ¿Qué hábito quieres crear?
    </h2>
    <p class="mt-[0.65rem] max-w-[25rem] leading-[1.55] text-text-secondary">
      Empieza con algo sencillo que te gustaría hacer más a menudo.
    </p>
  </header>
  <form
    class="grid gap-4"
    [formGroup]="habitForm"
    (ngSubmit)="createHabit()"
  >
    <div>
      <label
        class="mb-2 block text-[0.92rem] font-semibold text-text-primary"
        for="new-habit-name"
      >
        Tu hábito
      </label>
      <input
        hmInput
        id="new-habit-name"
        name="habit"
        formControlName="name"
        type="text"
        maxlength="100"
        class="rounded-[0.85rem]"
        autocomplete="off"
        placeholder="Leer 10 minutos"
      />
      <p class="mt-[0.55rem] text-[0.8rem] leading-[1.45] text-text-secondary">
        Cuanto más concreto, más fácil será empezar.
      </p>
    </div>
    @if (errorMessage()) {
    <p class="m-0 text-sm text-error" role="alert">{{ errorMessage() }}</p>
    }
    <button
      hmButton="primary"
      class="min-h-[3.25rem] w-full rounded-[0.85rem] font-semibold"
      type="submit"
      [disabled]="!canStartHabit()"
    >
      <span>{{ isSubmitting() ? 'Guardando…' : 'Comenzar hábito' }}</span>
      <svg
        class="size-[1.15rem]"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M4.75 12h14.5m-6-6 6 6-6 6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </form>
</div>
