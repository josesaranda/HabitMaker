@if (shouldShowNavbar()) {
<div class="app-navbar-shell">
  <habit-maker-ui-navbar
    class="app-navbar"
    brandLink="/home"
    [brandLabel]="'navigation.brandLabel' | transloco"
    [navigationLabel]="'navigation.main' | transloco"
  >
    <a class="app-navbar__link" routerLink="/home" aria-current="page">
      {{ 'navigation.home' | transloco }}
    </a>
    <a class="app-navbar__link" routerLink="/settings"
      >{{ 'navigation.settings' | transloco }}</a
    >
    <div class="app-navbar__icon-actions flex flex-row gap-3">
      <a
        class="app-navbar__mobile-settings"
        hmButtonIcon="secondary"
        size="normal"
        routerLink="/settings"
        [attr.aria-label]="'navigation.settings' | transloco"
        [title]="'navigation.settings' | transloco"
      >
        <habit-maker-ui-icon name="settings" />
      </a>
      <button
        hmButtonIcon="secondary"
        size="normal"
        type="button"
        [attr.aria-label]="'navigation.logout' | transloco"
        [title]="'navigation.logout' | transloco"
        (click)="logout()"
      >
        <habit-maker-ui-icon name="logout" />
      </button>
    </div>
  </habit-maker-ui-navbar>
</div>
}
<habit-maker-ui-header-outlet class="sticky top-16 max-[700px]:top-0" />
<div
  class="app-content-shell"
  [class.app-content-shell--with-mobile-navbar]="shouldShowNavbar()"
>
  <router-outlet />
</div>
