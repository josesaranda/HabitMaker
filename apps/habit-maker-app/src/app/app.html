@if (shouldShowNavbar()) {
<div class="app-navbar-shell">
  <hm-navbar
    class="app-navbar"
    brandLink="/home"
    [brandLabel]="'navigation.brandLabel' | transloco"
    [navigationLabel]="'navigation.main' | transloco"
  >
    <a class="app-navbar__link" routerLink="/home" aria-current="page">
      {{ 'navigation.home' | transloco }}
    </a>
    <a class="app-navbar__link" routerLink="/settings">{{ 'navigation.settings' | transloco }}</a>
    <div class="app-navbar__icon-actions flex flex-row gap-3">
      <button
        #addHabitTrigger
        hmButtonIcon="primary"
        size="small"
        type="button"
        [attr.aria-label]="'navigation.addHabit' | transloco"
        [title]="'navigation.addHabit' | transloco"
        (click)="newHabitModal.openFrom(addHabitTrigger)"
      >
        <hm-icon name="add" />
      </button>
      <a
        class="app-navbar__mobile-settings"
        hmButtonIcon="secondary"
        size="small"
        routerLink="/settings"
        [attr.aria-label]="'navigation.settings' | transloco"
        [title]="'navigation.settings' | transloco"
      >
        <hm-icon name="settings" />
      </a>
      <button
        hmButtonIcon="secondary"
        size="small"
        type="button"
        [attr.aria-label]="'navigation.logout' | transloco"
        [title]="'navigation.logout' | transloco"
        (click)="logout()"
      >
        <hm-icon name="logout" />
      </button>
    </div>
  </hm-navbar>
</div>
<hm-modal
  #newHabitModal
  [label]="'home.newHabitModal' | transloco"
  [closeLabel]="'navigation.closeDialog' | transloco"
>
  <app-new-habit (habitCreated)="newHabitModal.close()" />
</hm-modal>
}
<div class="app-content-shell">
  <router-outlet />
</div>
