@if (shouldShowNavbar()) {
<div class="app-navbar-shell">
  <hm-navbar
    class="app-navbar"
    brandLink="/home"
    [brandLabel]="'navigation.brandLabel' | transloco"
    [navigationLabel]="'navigation.main' | transloco"
  >
    <a
      class="app-navbar__link"
      routerLink="/home"
      routerLinkActive="app-navbar__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      {{ 'navigation.home' | transloco }}
    </a>
    <a
      class="app-navbar__link"
      routerLink="/today"
      routerLinkActive="app-navbar__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      {{ 'navigation.today' | transloco }}
    </a>
    <a
      class="app-navbar__link"
      routerLink="/settings"
      routerLinkActive="app-navbar__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      {{ 'navigation.settings' | transloco }}
    </a>
    <div class="app-navbar__icon-actions flex flex-row gap-3">
      <a
        class="app-navbar__mobile-today"
        hmButtonIcon="secondary"
        size="normal"
        [selected]="isTodayActive()"
        routerLink="/today"
        [attr.aria-label]="'navigation.today' | transloco"
        [title]="'navigation.today' | transloco"
      >
        <span class="relative inline-grid place-items-center">
          <hm-icon name="calendar" />
          <span
            hmText="caption-2xs"
            class="absolute left-1/2 top-[64%] -translate-x-1/2 -translate-y-1/2 font-semibold leading-none"
            aria-hidden="true"
            >{{ currentDay() }}</span
          >
        </span>
      </a>
      <a
        class="app-navbar__mobile-settings"
        hmButtonIcon="secondary"
        size="normal"
        [selected]="isSettingsActive()"
        routerLink="/settings"
        [attr.aria-label]="'navigation.settings' | transloco"
        [title]="'navigation.settings' | transloco"
      >
        <hm-icon name="settings" />
      </a>
      <button
        hmButtonIcon="secondary"
        size="normal"
        type="button"
        [attr.aria-label]="'navigation.logout' | transloco"
        [title]="'navigation.logout' | transloco"
        (click)="logout()"
      >
        <hm-icon name="logout" />
      </button>
    </div>
  </hm-navbar>
</div>
}
<hm-header-outlet class="sticky top-16 max-[700px]:top-0" />
<div
  class="app-content-shell"
  [class.app-content-shell--with-mobile-navbar]="shouldShowNavbar()"
>
  <router-outlet />
</div>
