@if (shouldShowNavbar()) {
<div class="app-navbar-shell">
  <hm-navbar class="app-navbar" brandLink="/home">
    <a class="app-navbar__link" routerLink="/home" aria-current="page">
      Inicio
    </a>
    <a class="app-navbar__link" routerLink="/home">Ajustes</a>
    <div class="app-navbar__icon-actions flex flex-row gap-3">
      <button
        #addHabitTrigger
        hmButtonIcon="primary"
        size="small"
        type="button"
        aria-label="Añadir hábito"
        title="Añadir hábito"
        (click)="newHabitModal.openFrom(addHabitTrigger)"
      >
        <hm-icon name="add" />
      </button>
      <button
        hmButtonIcon="secondary"
        size="small"
        type="button"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        (click)="logout()"
      >
        <hm-icon name="logout" />
      </button>
    </div>
  </hm-navbar>
</div>
<hm-modal #newHabitModal label="¿Qué hábito quieres crear?">
  <app-new-habit (habitCreated)="newHabitModal.close()" />
</hm-modal>
}
<div class="app-content-shell">
  <router-outlet />
</div>
