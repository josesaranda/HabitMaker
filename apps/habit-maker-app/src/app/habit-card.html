<habit-maker-ui-card
  [since]="startedAt()"
  [locale]="locale()"
  [link]="link()"
  [linkLabel]="linkLabel()"
>
  <h2 hmCardTitle>
    {{ name().substring(0, 30) + (name().length > 30 ? '...' : '') }}
  </h2>
  <habit-maker-ui-day-selector
    [days]="days()"
    [localeDays]="localeDays()"
    [showNavigation]="showDayNavigation()"
    [dayToggleEnabled]="dayToggleEnabled()"
    [dayToggleDisabled]="dayToggleDisabled()"
    [previousLabel]="labels().previousDays"
    [nextLabel]="labels().nextDays"
    (navigation)="navigate($event)"
    (dayToggled)="toggleDay($event)"
  />
  @if (completionError()) {
  <p class="mt-3 text-xs text-white/70" role="alert">
    {{ labels().completionError }}
  </p>
  }
</habit-maker-ui-card>
