name: Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require successful CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: context.sha,
              per_page: 100,
            });

            const successfulRun = data.workflow_runs.find(
              (run) => run.conclusion === 'success'
            );

            if (!successfulRun) {
              core.setFailed(`CI has not succeeded for commit ${context.sha}.`);
              return;
            }

            core.info(`CI succeeded: ${successfulRun.html_url}`);

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
