name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  base-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Pull requests must target 'next' (the base branch). 'main' mirrors the latest release and must not receive PRs."
          exit 1

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: tar -czf node_modules.tar.gz node_modules

      - uses: actions/upload-artifact@v7
        with:
          name: node-modules
          path: node_modules.tar.gz
          retention-days: 1

  quality:
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/download-artifact@v7
        with:
          name: node-modules
      - run: tar -xzf node_modules.tar.gz && rm node_modules.tar.gz

      - run: npx nx format:check --base="$NX_BASE" --head="$NX_HEAD"
      - run: npx nx affected -t lint typecheck --base="$NX_BASE" --head="$NX_HEAD"

  build:
    needs: [dependencies, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/download-artifact@v7
        with:
          name: node-modules
      - run: tar -xzf node_modules.tar.gz && rm node_modules.tar.gz

      - name: Determine whether desktop build is required
        id: desktop
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/next" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux dependencies for desktop builds
        if: steps.desktop.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build affected projects
        run: |
          if [ "${{ steps.desktop.outputs.build }}" = "true" ]; then
            npx nx affected -t build --base="$NX_BASE" --head="$NX_HEAD"
          else
            npx nx affected -t build --base="$NX_BASE" --head="$NX_HEAD" --exclude=HabitMakerDesktop
          fi

  test:
    needs: [dependencies, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/download-artifact@v7
        with:
          name: node-modules
      - run: tar -xzf node_modules.tar.gz && rm node_modules.tar.gz

      - run: npx nx affected -t test e2e --base="$NX_BASE" --head="$NX_HEAD"
