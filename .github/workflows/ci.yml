name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: tar -czf node_modules.tar.gz node_modules

      - uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules.tar.gz
          retention-days: 1

  main:
    needs: dependencies
    runs-on: ubuntu-latest
    outputs:
      release_required: ${{ steps.release-impact.outputs.required }}
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/download-artifact@v4
        with:
          name: node-modules
      - run: tar -xzf node_modules.tar.gz && rm node_modules.tar.gz

      - name: Determine whether a release project is affected
        id: release-impact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          affected_projects=$(npx nx show projects --affected --base="$BASE_SHA" --head="$HEAD_SHA" --json)
          release_required=$(node -e '
            const projects = JSON.parse(process.argv[1]);
            console.log(projects.some((project) => ["HabitMakerApp", "HabitMakerApi"].includes(project)));
          ' "$affected_projects")
          echo "required=$release_required" >> "$GITHUB_OUTPUT"

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: npx nx record -- npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: npx nx fix-ci
        if: always()

  release:
    needs: main
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.main.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/download-artifact@v4
        with:
          name: node-modules
      - run: tar -xzf node_modules.tar.gz && rm node_modules.tar.gz

      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
