name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: tar -czf node_modules.tar.gz node_modules

      - uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules.tar.gz
          retention-days: 1

  build:
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/download-artifact@v4
        with:
          name: node-modules
      - run: tar -xzf node_modules.tar.gz && rm node_modules.tar.gz

      - run: npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint build typecheck

  test:
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/download-artifact@v4
        with:
          name: node-modules
      - run: tar -xzf node_modules.tar.gz && rm node_modules.tar.gz

      - run: npx nx run-many -t test e2e
