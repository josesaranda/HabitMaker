services:
  app:
    build:
      context: .
      target: app
    environment:
      SERVER_PORT: ${SERVER_PORT:-3000}
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      SERVER_PORT: ${SERVER_PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${APP_PORT:-8080}}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-habitmaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habitmaker-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-habitmaker}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_PROTOCOL: ${SMTP_PROTOCOL:-smtp}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    command: ["postgres", "-p", "${POSTGRES_PORT:-5432}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-habitmaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habitmaker-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-habitmaker}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p $${POSTGRES_PORT} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
